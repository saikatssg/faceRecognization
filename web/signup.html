<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>

        form{
            width: 65% !important;
            margin: 2rem auto;
        }

        .form-label{
            margin-bottom: 1rem !important;
            font-size: 1.4rem;
        }
        .imgPrev{
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: flex-start;
            width: 20rem;
            margin: 1.5rem;
            border-radius: 1rem;
        }
        .imgPrev img{
            border-radius: inherit;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        input,select{
            outline: none;
            border:1px solid rgb(125, 52, 89) !important;
            transition: all 0.5s;
        }
        input:focus, select:focus{
            box-shadow: none !important;
            border-color: rgb(244, 99, 83) !important;
        }

        .passview{
            position: relative;
        }

        .eyeprev{
            position: absolute;
            right: 0.5rem;
            top: 0;
            font-size: 1.6rem;
            cursor: pointer;
            transition: all 0.5s;
        }
        #errFile{
            margin-left: 1.5rem;
            display: none;
            color:tomato;
            font-weight: 700 !important;
            font-family: 'Poppins',sans-serif;
            font-size: 1rem !important;
        }
    </style>
</head>
<body>
    
    <div class="container">
        <h1 class="text-center my-4 p-2 display-4 fw-normal text-primary ">Student Registraion Portal</h1>
    </div>
    <div class="container my-5" style="width: 50%;">
        <div class="alert alert-danger d-none align-items-center" role="alert" id="alert">
            <i class="bi bi-exclamation-triangle-fill me-2" ></i>
            <span id="error"> </span>
        </div>
    </div>

    <div class="container">
        <div class="row">
            <form action="#"  method="post">
                <div class="mb-3">
                    <label for="fname" class="form-label">First Name:</label>
                    <input type="text" id="fname" placeholder="First Name" class="form-control">
                </div>

                <div class="mb-3">
                    <label for="lname" class="form-label">Last Name</label>
                    <input type="text" id="lname" placeholder="Last Name" class="form-control">
                </div>

                <div class="mb-3">
                    <label for="user" class="form-label">User Name</label>
                    <input type="text" id="user" placeholder="User Name" class="form-control">
                </div>

                <div class="mb-3">
                    <label for="pwd" class="form-label">Password</label>
                    <div class="passview">
                        <input type="password" id="pwd" placeholder="Enter Password" class="form-control" maxlength="20">
                        <i class="bi bi-eye-fill eyeprev" id="eyeprev" ></i>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="dob" class="form-label">DOB</label>
                    <input type="date" id="dob"  class="form-control">
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email ID:</label>
                    <input type="email" id="email" placeholder="Email Id" class="form-control" aria-describedby="emailHelp" >
                    <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
                </div>

                <div class="mb-3"  >
                    <label  class="form-label">Select Your Gender</label>
                    <div class="container d-flex  " style="width: 40%; justify-content:space-between;  margin-left: 0;">
                        <label for="male"> Male </label>
                        <input type="radio" id="male" name="gender" class="form-radio">

                        <label for="female"> Female </label>
                        <input type="radio" id="female" name="gender"  class="form-radio">

                        <label for="others"> Others </label>
                        <input type="radio" id="others" name="gender"  class="form-radio">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="city" class="form-label">City Name :</label>
                    <select id="city" class="form-select">
                        <option value="0" selected disabled>Select The City Name</option>
                        <option value="kolkata">Kolkata</option>
                        <option value="delhi">New Delhi</option>
                        <option value="pune">Pune</option>
                        <option value="mumbai">Mumbai</option>
                        <option value="bangaluru">Bangaluru</option>
                    </select>

        
                </div>

                <div class="mb-3">
                    <label for="upload" class="form-label">Upload Your Photo <span id="errFile"></span></label>
                    <input type="file" id="upload"  class="form-control btn btn-success">
                    <div class="imgPrev">
                        <img src="../images/noprev.png" name="prev" id="prev">
                    </div>
                </div>

                <div class="mb-3">
                   
                    <input type="checkbox" id="checkPointer"  class="form-checkbox">
                     <label for="checkPointer" class="form-label ms-2">I Agree</label>
                </div>

                <div class="mb-3">
                    
                    <button class="px-4 py-2 btn btn-success" id="submit" type="submit">Signup</button>
                    <button class="px-4 py-2  ms-2 btn btn-danger" type="reset">Reset</button>
                </div>

            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/upload.js"></script>
    <script src="../js/validate.js"></script>

        let btn1 = document.getElementById("eyeprev");

        let pass = document.getElementById("pwd")

        // console.log(btn1.classList);
        

        btn1.addEventListener("click",function(){
            if(pass.type == "password")
            {
                pass.type="text";
                btn1.classList.remove('bi-eye-fill');
                btn1.classList.add('bi-eye-slash-fill')
            }
            else{
                pass.type="password";
                btn1.classList.remove('bi-eye-slash-fill');
                btn1.classList.add('bi-eye-fill')
            }
        })
    </script>
   
</body>
</html>
